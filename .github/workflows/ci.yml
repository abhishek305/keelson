name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Generated files are up to date
        run: |
          npm run build
          git diff --exit-code -- skills plugins .claude-plugin || (echo "::error::Run 'npm run build' and commit the result." && exit 1)
      - run: npm run check
      - run: npm test
      - name: Shellcheck hooks
        run: shellcheck -S error adapters/claude-code/*.sh adapters/claude-code/hooks/*.sh
      - name: Package contents
        run: npm pack --dry-run
