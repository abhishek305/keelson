name: Bug
description: The installer, a hook or an adapter misbehaves
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Keelson version, placeholder: "npx keelson --version" }
    validations: { required: true }
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Claude Code, Codex, OpenCode, Cursor, Copilot, Gemini CLI, ChatGPT, Installer only]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, expected vs actual, and `npx keelson doctor` output." }
    validations: { required: true }
